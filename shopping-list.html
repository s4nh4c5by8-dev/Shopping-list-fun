<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Pretty in Pink Shopping List 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #ffd7e8;
    --pink: #ff8fc7;
    --hot-pink: #ff5aa8;
    --deep-pink: #d6337a;
    --gold: #d9a441;
    --gold-light: #f7dfa0;
    --gold-deep: #b8860b;
    --cream: #fff8ec;
    --card-bg: rgba(255, 251, 245, 0.96);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, var(--blush), var(--pink), var(--cream), var(--blush));
    background-size: 400% 400%;
    animation: bgShift 16s ease infinite;
    min-height: 100vh;
    padding: 40px 16px 80px;
    position: relative;
  }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #sparkleLayer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .sparkle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: radial-gradient(circle, #fff 0%, var(--gold-light) 55%, transparent 80%);
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 2.6s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
  }

  .confetti {
    position: absolute;
    top: -20px;
    font-size: 20px;
    animation: fall linear infinite;
    opacity: 0.9;
  }

  @keyframes fall {
    0% { transform: translateY(-5vh) rotate(0deg); }
    100% { transform: translateY(105vh) rotate(360deg); }
  }

  .wrapper {
    position: relative;
    z-index: 2;
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    font-size: clamp(2.8rem, 9vw, 5rem);
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold-light), var(--hot-pink), var(--gold-deep));
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmerText 5s linear infinite;
    filter: drop-shadow(0 2px 10px rgba(214, 51, 122, 0.35));
  }

  @keyframes shimmerText {
    to { background-position: 300% center; }
  }

  .subtitle {
    text-align: center;
    color: var(--deep-pink);
    font-weight: 600;
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    margin-bottom: 24px;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 6px rgba(255, 255, 255, 0.6);
  }

  .glow-strip {
    height: 5px;
    border-radius: 999px;
    margin: 0 auto 34px;
    max-width: 220px;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold-light), var(--hot-pink));
    background-size: 300% auto;
    animation: shimmerText 4s linear infinite;
    box-shadow: 0 0 16px rgba(217, 164, 65, 0.7);
  }

  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 14px;
  }

  li.item {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--deep-pink);
    position: relative;
    border: 2px solid var(--gold-light);
    box-shadow: 0 6px 0 rgba(214, 51, 122, 0.12), 0 8px 20px rgba(214, 51, 122, 0.18);
    transform: translateY(0) rotate(0deg);
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s ease, border-color 0.25s ease;
    animation: popIn 0.55s cubic-bezier(.34,1.56,.64,1) backwards;
  }

  li.item::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 20px;
    padding: 2px;
    background: linear-gradient(120deg, var(--gold), transparent 40%, transparent 60%, var(--gold));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.5;
    pointer-events: none;
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.4) translateY(30px) rotate(-6deg); }
    100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
  }

  li.item:hover {
    transform: translateY(-4px) rotate(-1deg) scale(1.02);
    box-shadow: 0 10px 0 rgba(214, 51, 122, 0.14), 0 14px 26px rgba(214, 51, 122, 0.28);
    border-color: var(--hot-pink);
  }

  li.item .emoji {
    font-size: 1.8rem;
    filter: drop-shadow(0 2px 3px rgba(214, 51, 122, 0.25));
    transition: transform 0.3s ease;
    flex-shrink: 0;
  }

  li.item:hover .emoji {
    transform: scale(1.3) rotate(12deg);
  }

  li.item .label {
    flex: 1;
  }

  li.item .bow {
    font-size: 1rem;
    opacity: 0.7;
    flex-shrink: 0;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    color: var(--deep-pink);
    font-weight: 600;
    font-size: 0.9rem;
    opacity: 0.85;
  }
</style>
</head>
<body>

<div id="sparkleLayer"></div>

<div class="wrapper">
  <h1>💗 Pretty Little Shopping List 💗</h1>
  <p class="subtitle">🎀 Everything on the list, dressed in pink & gold 🎀</p>
  <div class="glow-strip"></div>

  <ul class="list" id="list"></ul>

  <footer>Made with 💕 gold shimmer & girly sparkle ✨</footer>
</div>

<script>
  const items = [
    { name: "Ground beef", emoji: "🥩" },
    { name: "Cucumbers", emoji: "🥒" },
    { name: "Cashew butter", emoji: "🥜" },
    { name: "Chicken", emoji: "🍗" },
    { name: "Oat milk", emoji: "🥛" },
    { name: "Bread", emoji: "🍞" },
    { name: "Bagels", emoji: "🥯" },
    { name: "Sweet potato fries", emoji: "🍠" },
    { name: "Avocados", emoji: "🥑" },
    { name: "Berries", emoji: "🫐" },
    { name: "Apple", emoji: "🍎" },
    { name: "Orange", emoji: "🍊" },
    { name: "Graham crackers", emoji: "🍪" },
    { name: "Monk fruit", emoji: "🍈" },
    { name: "Sugar", emoji: "🧂" },
    { name: "Decaf coffee", emoji: "☕" },
  ];

  const listEl = document.getElementById("list");

  items.forEach((item, i) => {
    const li = document.createElement("li");
    li.className = "item";
    li.style.animationDelay = `${i * 0.06}s`;
    li.innerHTML = `
      <span class="emoji">${item.emoji}</span>
      <span class="label">${item.name}</span>
      <span class="bow">🎀</span>
    `;
    listEl.appendChild(li);
  });

  const sparkleLayer = document.getElementById("sparkleLayer");
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = Math.random() * 3 + "s";
    s.style.animationDuration = 2 + Math.random() * 2.5 + "s";
    sparkleLayer.appendChild(s);
  }

  const confettiEmojis = ["💗", "🎀", "👑", "💅", "🌸", "✨"];
  for (let i = 0; i < 14; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.textContent = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
    c.style.left = Math.random() * 100 + "%";
    c.style.animationDuration = 8 + Math.random() * 10 + "s";
    c.style.animationDelay = Math.random() * 10 + "s";
    sparkleLayer.appendChild(c);
  }
</script>

</body>
</html>
